upstream der_app { server app:8000; }

limit_req_zone $binary_remote_addr zone=der_limit:10m rate=10r/s;

server {
    listen 80;
    client_max_body_size 2m;

    location / {
        limit_req zone=der_limit burst=20 nodelay;
        proxy_pass http://der_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;   # Agent 任务可能执行较久
    }

    location /health {
        proxy_pass http://der_app/health;
        access_log off;
    }
}

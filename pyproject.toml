[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-employee-runtime"
version = "0.1.0"
description = "执行型数字员工运行时：Skill Registry / Progressive Context / Planning-ReACT / 补偿式执行"
requires-python = ">=3.10"
authors = [{name = "qianyao"}]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
der-demo = "scripts.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

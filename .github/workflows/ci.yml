name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest -q
      - run: python benchmarks/context_cost.py
      - name: forbid swallowed exceptions
        run: |
          if grep -R "except Exception: pass" src; then exit 1; fi
